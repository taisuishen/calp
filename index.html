<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKX 清仓利润计算器</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#272b35; --fg:#e8eaf0;
    --muted:#8b93a7; --accent:#5b9dff; --up:#2ebd85; --down:#f6465d;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input,select{background:#0f1115;border:1px solid var(--line);color:var(--fg);
       border-radius:8px;padding:10px 12px;font-size:15px;width:100%}
  .f{flex:1 1 160px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 20px;
       font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:400}
  .big{font-size:34px;font-weight:650;letter-spacing:-.5px;margin:2px 0 2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
  .k{font-size:12px;color:var(--muted)}
  .v{font-size:16px;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  th:first-child,td:first-child{text-align:left}
  .err{color:var(--down)}
  .muted{color:var(--muted)}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}
  .up{color:var(--up)} .down{color:var(--down)}
  .hr{height:1px;background:var(--line);margin:18px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>OKX 合约清仓利润计算器</h1>
  <div class="sub">按当前买一档往下吃单（taker 市价卖出），实时抓取 OKX 公开盘口，不需要 API key。填成本价即可算出这笔清仓的盈亏。</div>

  <div class="card">
    <div class="row">
      <div class="f"><label>合约</label>
        <select id="inst">
          <option value="XAU-USDT-SWAP">黄金 XAU-USDT 永续</option>
          <option value="XAG-USDT-SWAP">白银 XAG-USDT 永续</option>
          <option value="ALGO-USDT-SWAP">ALGO-USDT 永续</option>
          <option value="ALGO-USDC-SWAP">ALGO-USDC 永续</option>
        </select>
      </div>
      <div class="f"><label>持仓数量（<span class="u">XAU</span>）</label>
        <input id="qty" type="number" value="132" step="1">
      </div>
      <div class="f"><label>成本价（USDT / <span class="u">XAU</span>）</label>
        <input id="cost" type="number" value="4347.6" step="0.1" placeholder="填了才算盈亏">
      </div>
      <div><button id="go">计算</button></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="f"><label>taker 手续费率（%，单边）</label>
        <input id="fee" type="number" value="0.05" step="0.01">
      </div>
      <div class="f" style="flex:2 1 240px">
        <label style="margin:0"><input type="checkbox" id="auto" style="width:auto;margin-right:6px">每 3 秒自动刷新</label>
      </div>
    </div>
  </div>

  <div class="card" id="out"><span class="muted">点「计算」开始。</span></div>
</div>

<script>
const HOSTS = ["https://www.okx.com", "https://aws.okx.com"];
const fmt = (n,d=4) => n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = n => n.toLocaleString("en-US",{maximumFractionDigits:0});
// 小数位数：从 tickSz / ctVal 之类的步长字符串里数出来
const decOf = step => { const t = String(step); const i = t.indexOf("."); return i < 0 ? 0 : t.length - i - 1; };

// 切换合约时同步单位文字，数量没被手动改过就换成该合约的常用默认值
const DEF_QTY = {"XAU-USDT-SWAP":132, "XAG-USDT-SWAP":5000, "ALGO-USDT-SWAP":720000, "ALGO-USDC-SWAP":720000};
const UNIT = {"XAU-USDT-SWAP":"XAU", "XAG-USDT-SWAP":"XAG", "ALGO-USDT-SWAP":"ALGO", "ALGO-USDC-SWAP":"ALGO"};
let qtyTouched = false;

async function get(path){
  let last;
  for (const h of HOSTS){
    try{
      const r = await fetch(h + path, {cache:"no-store"});
      const j = await r.json();
      if (j.code !== "0") throw new Error(j.msg || ("code " + j.code));
      return j.data;
    }catch(e){ last = e; }
  }
  throw last;
}

const instCache = {};
async function ctVal(instId){
  if (instCache[instId]) return instCache[instId];
  const d = await get(`/api/v5/public/instruments?instType=SWAP&instId=${instId}`);
  if (!d.length) throw new Error("找不到合约 " + instId);
  return instCache[instId] = {
    ct: parseFloat(d[0].ctVal),
    ccy: d[0].ctValCcy,
    pd: decOf(d[0].tickSz),      // 价格小数位
    qd: decOf(d[0].ctVal),       // 币数小数位（1 张 = ctVal 个）
  };
}

async function calc(){
  const instId = document.getElementById("inst").value;
  const coins = parseFloat(document.getElementById("qty").value);
  const cost = parseFloat(document.getElementById("cost").value);
  const feeRate = (parseFloat(document.getElementById("fee").value) || 0) / 100;
  const out = document.getElementById("out");
  if (!(coins > 0)) { out.innerHTML = '<span class="err">数量必须大于 0</span>'; return; }
  const hasCost = cost > 0;

  const {ct, ccy, pd, qd} = await ctVal(instId);
  const fmtP = n => fmt(n, pd);                                    // 挂单价
  const fmtA = n => fmt(n, pd + 1);                                // 均价（多一位）
  const fmtQ = n => n.toLocaleString("en-US",{maximumFractionDigits:qd});
  const books = await get(`/api/v5/market/books?instId=${instId}&sz=400`);
  const bids = books[0].bids.map(([p,s]) => [parseFloat(p), parseFloat(s)]);
  const asks = books[0].asks.map(([p,s]) => [parseFloat(p), parseFloat(s)]);
  const ts = parseInt(books[0].ts, 10);

  const needCt = coins / ct;                      // 需要卖出的张数
  let rem = needCt, notional = 0, levels = 0;
  const rows = [];
  for (const [p, s] of bids){
    if (rem <= 1e-12) break;
    const take = Math.min(rem, s);
    notional += take * p; rem -= take; levels++;
    if (rows.length < 12) rows.push([p, take, (needCt - rem) * ct, notional]);
  }
  const filledCt = needCt - rem;
  const filledCoins = filledCt * ct;
  const avg = filledCt > 0 ? notional / filledCt : 0;
  const best = bids[0][0], bestAsk = asks[0][0], mid = (best + bestAsk) / 2;
  const slipBid = (best - avg) / best * 100;
  const slipMid = (mid - avg) / mid * 100;
  const depthCoins = bids.reduce((a,[,s]) => a + s, 0) * ct;

  // 清仓盈亏
  const revenue   = notional * ct;              // 卖出总收入（USDT）
  const feeCost   = revenue * feeRate;          // taker 手续费
  const netRev    = revenue - feeCost;          // 到手金额
  const costTotal = cost * filledCoins;         // 建仓总成本
  const pnlGross  = revenue - costTotal;        // 毛利
  const pnlNet    = netRev - costTotal;         // 净利（扣手续费）
  const roi       = costTotal > 0 ? pnlNet / costTotal * 100 : 0;
  const perCoin   = filledCoins > 0 ? pnlNet / filledCoins : 0;
  const breakeven = filledCoins > 0 ? costTotal / (filledCoins * (1 - feeRate)) : 0;  // 保本均价
  const cls       = pnlNet >= 0 ? "up" : "down";
  const sign      = n => (n >= 0 ? "+" : "-") + fmt(Math.abs(n), 2);

  out.innerHTML = `
    ${hasCost ? `
    <div class="k">清仓 ${fmtQ(filledCoins)} ${ccy} 的净盈亏（成本价 ${fmtA(cost)}）</div>
    <div class="big ${cls}">${sign(pnlNet)} <span style="font-size:18px;color:var(--muted)">USDT</span></div>
    <div class="k">收益率 <span class="${cls}">${pnlNet>=0?"+":"-"}${fmt(Math.abs(roi),2)}%</span>　·　每 ${ccy} ${pnlNet>=0?"赚":"亏"} ${fmtA(Math.abs(perCoin))} USDT</div>
    <div class="grid">
      <div><div class="k">保本均价（含手续费）</div><div class="v">${fmtA(breakeven)}</div></div>
      <div><div class="k">建仓总成本</div><div class="v">${fmt(costTotal,2)} USDT</div></div>
      <div><div class="k">卖出总收入</div><div class="v">${fmt(revenue,2)} USDT</div></div>
      <div><div class="k">手续费 (${fmt(feeRate*100,3)}%)</div><div class="v down">-${fmt(feeCost,2)} USDT</div></div>
      <div><div class="k">到手金额</div><div class="v">${fmt(netRev,2)} USDT</div></div>
      <div><div class="k">毛利（未扣手续费）</div><div class="v ${pnlGross>=0?"up":"down"}">${sign(pnlGross)} USDT</div></div>
      <div><div class="k">数量</div><div class="v">${fmt0(needCt)} 张 = ${fmtQ(filledCoins)} ${ccy}</div></div>
    </div>
    <div class="hr"></div>
    <div class="k">成交均价</div>
    <div class="big">${fmtA(avg)} <span style="font-size:18px;color:var(--muted)">USDT</span></div>
    ` : `
    <div class="k">卖出 ${fmtQ(filledCoins)} ${ccy} 的成交均价</div>
    <div class="big">${fmtA(avg)} <span style="font-size:18px;color:var(--muted)">USDT</span></div>
    <div class="k">总收入 ≈ ${fmt(revenue, 2)} USDT　·　${fmt0(needCt)} 张（1 张 = ${ct} ${ccy}）</div>
    `}
    <div class="grid">
      <div><div class="k">买一 / 卖一</div><div class="v">${fmtP(best)} / ${fmtP(bestAsk)}</div></div>
      <div><div class="k">中间价</div><div class="v">${fmtA(mid)}</div></div>
      <div><div class="k">相对买一滑点</div><div class="v" style="color:var(--down)">-${fmt(slipBid,3)}%</div></div>
      <div><div class="k">相对中间价滑点</div><div class="v" style="color:var(--down)">-${fmt(slipMid,3)}%</div></div>
      <div><div class="k">吃掉档位</div><div class="v">${levels} 档，最低 ${fmtP(rows.length?bids[levels-1][0]:0)}</div></div>
      <div><div class="k">买盘总深度(400档)</div><div class="v">${fmtQ(depthCoins)} ${ccy}</div></div>
    </div>
    ${rem > 1e-9 ? `<p class="err">⚠️ 盘口深度不足：400 档买单只够卖 ${fmtQ(filledCoins)} ${ccy}，还差 ${fmtQ(rem*ct)}。上面均价只针对已成交部分。</p>` : ""}
    <details style="margin-top:14px"><summary>前 ${rows.length} 档明细</summary>
      <table><thead><tr><th>价格</th><th>吃张数</th><th>累计 ${ccy}</th><th>累计均价</th>${hasCost?"<th>累计净盈亏</th>":""}</tr></thead><tbody>
      ${rows.map(([p,c,cum,n],i) => {
        const cumCt = rows.slice(0,i+1).reduce((a,r)=>a+r[1],0);
        const cumPnl = n * ct * (1 - feeRate) - cost * cum;
        return `<tr><td>${fmtP(p)}</td><td>${fmt0(c)}</td><td>${fmtQ(cum)}</td><td>${fmtA(n / cumCt)}</td>${hasCost?`<td class="${cumPnl>=0?"up":"down"}">${sign(cumPnl)}</td>`:""}</tr>`;
      }).join("")}
      </tbody></table>
    </details>
    <div class="k" style="margin-top:12px">盘口时间 ${new Date(ts).toLocaleTimeString()}　·　仅按盘口静态估算，未计资金费与撮合期间的盘口变化；手续费按上面填的 taker 费率单边扣除。</div>`;
}

let timer = null;
const btn = document.getElementById("go");
async function run(){
  btn.disabled = true;
  try { await calc(); }
  catch(e){ document.getElementById("out").innerHTML = '<span class="err">请求失败：' + e.message + '</span>'; }
  finally { btn.disabled = false; }
}
btn.onclick = run;

const instEl = document.getElementById("inst"), qtyEl = document.getElementById("qty");
qtyEl.oninput = () => { qtyTouched = true; };
function syncUnit(){
  const u = UNIT[instEl.value] || "币";
  document.querySelectorAll(".u").forEach(el => el.textContent = u);
  if (!qtyTouched && DEF_QTY[instEl.value]) qtyEl.value = DEF_QTY[instEl.value];
}
instEl.onchange = syncUnit;
syncUnit();

document.getElementById("auto").onchange = e => {
  clearInterval(timer);
  if (e.target.checked){ run(); timer = setInterval(run, 3000); }
};
</script>
</body>
</html>
